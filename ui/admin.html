<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,"Segoe UI",sans-serif;padding:16px max(16px,env(safe-area-inset-left))}
main{max-width:1240px;margin:0 auto;display:grid;gap:16px}h1{font-size:1.5rem;margin:0}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;overflow-x:auto}
.muted{color:var(--muted)}.small{font-size:.86rem}table{width:100%;border-collapse:collapse}th{text-align:left;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--line)}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.err{color:var(--red)}
</style>
<main>
  <h1>Plaid Firefly Connector admin</h1>
  <p class="muted small">General health and call counts, only when you ask. Nothing here shows what anyone asked for or any of their data, and the gateway keeps no log of requests: no addresses, search terms, tokens or bodies.</p>
  <form class="panel row" id="login"><input id="tok" type="password" placeholder="Admin password" autocomplete="current-password" required style="flex:1;min-width:200px"><button class="primary" type="submit">Check now</button><button type="button" id="reset">Clear counts</button><span id="msg" class="small muted"></span></form>
  <div class="panel" id="out" hidden></div>
  <div class="panel" id="people" hidden></div>
  <div class="panel" id="person" hidden></div>
  <div class="panel" id="plaid" hidden></div>
  <div class="panel" id="orb" hidden></div>
</main>
<script>
const $ = (s) => document.querySelector(s), out = $("#out"), msg = $("#msg");
const el = (t, a = {}, ...k) => { const e = document.createElement(t); for (const [x, v] of Object.entries(a)) e.setAttribute(x, v); k.flat().forEach((c) => { if (c === null || c === undefined || c === false) return; e.append(c?.nodeType ? c : document.createTextNode(String(c))); }); return e; };

}

const b64 = () => { const a = crypto.getRandomValues(new Uint8Array(32)); return btoa(String.fromCharCode(...a)).replace(/\+/g, "-").replace(/\//g, "_"); };   // a Fernet key; made here, so the gateway never sees it

const res = el("div");                                    // kept across refreshes so a just-issued login token is not wiped

      orbRes.replaceChildren(el("p", { class: "small" }, "Copy this key now. It is shown once and only its hash is kept:"), el("pre", { style: "white-space:pre-wrap;word-break:break-all;margin:0" }, r.key),

/* ---------- one person: their bank links and their Firefly III connection, run from here ---------- */
let who = null, everyone = [];
const pmsg = el("div", { class: "status small", role: "status" });     // what the last button did, kept next to the buttons
const ago = (t) => { if (!t) return "never"; const m = Math.round((Date.now() / 1000 - t) / 60); return m < 1 ? "just now" : m < 60 ? m + " min ago" : m < 1440 ? Math.round(m / 60) + " h ago" : Math.round(m / 1440) + " days ago"; };
const pullMsg = (r) => (r.ok ? `Pulled: ${r.added} new, ${r.modified} changed, ${r.removed} removed. ` : `The bank pull failed: ${r.error}. `) + (r.firefly.skipped ? "Firefly III is not set up." : r.firefly.ok ? `Firefly III: ${r.firefly.sent} sent.` : "Sending to Firefly III failed; see the log below.");
const P = (path, method = "GET", body) => call(`/admin/p/${encodeURIComponent(who)}/${path}`, method, body);
const loadPlaid = () => new Promise((ok, no) => { if (window.Plaid) return ok(); const sc = document.createElement("script"); sc.src = "https://cdn.plaid.com/link/v2/stable/link-initialize.js"; sc.onload = ok; sc.onerror = no; document.head.append(sc); });
async function openLink(itemId, resume) {
  await loadPlaid();

  else { token = (await P("plaid/link-token" + (itemId ? "?item_id=" + encodeURIComponent(itemId) : ""), "POST", {})).link_token; localStorage.setItem("gb_link", JSON.stringify({ token, who, item: itemId || "" })); }
  if (!token) throw new Error("This sign-in expired. Press Link a bank again.");
  const tell = (t, bad) => { pmsg.textContent = t; pmsg.className = "status small " + (bad ? "err" : "ok"); };
  const cfg = { token, onExit: (err) => { if (err) tell(err.display_message || err.error_message || "Linking stopped", true); },
    onSuccess: async (pt, meta) => { localStorage.removeItem("gb_link");
      try { if (itemId) { tell("Relinked. Pulling the bank now…"); const r = await P("api/plaid/items/" + encodeURIComponent(itemId) + "/pull", "POST", {}); tell("Relinked. " + pullMsg(r), !r.ok); }
        else { const r = await P("plaid/exchange", "POST", { public_token: pt, institution: (meta.institution || {}).name || "" }); tell(`Linked ${(meta.institution || {}).name || "the bank"}. ${(r.sync || {}).added || 0} transactions pulled and sent on to Firefly III.`); }
        renderPerson(); } catch (e) { tell(e.message, true); renderPerson(); } } };

}
async function renderPerson() {

  catch (e) { box.replaceChildren(el("h2", { style: "margin:0 0 6px;font-size:1.1rem" }, who), el("p", { class: "small err" }, e.message)); box.hidden = false; return; }
  const plaid = st.plaid || {}, run = async (fn, ok, busy) => { if (busy) say(busy); try { const r = await fn(); const t = typeof ok === "function" ? ok(r) : ok; say(t, r && r.ok === false); await renderPerson(); } catch (e) { say(e.message, true); } };
  const lastOf = (id) => (plog.log || []).find((l) => l.item_id === id && l.what !== "refresh");
  const sel = (opts, cur, onchange) => { const s = el("select", {}, opts.map(([v, t]) => el("option", { value: v }, t))); s.value = cur; s.addEventListener("change", () => onchange(s.value)); return s; };
